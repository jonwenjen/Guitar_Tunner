name: Publish web app

# Publishes www/ to GitHub Pages on every push to main that touches the app.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then this workflow skips the deploy with a notice instead of failing.
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is switched on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Turn it on in Settings → Pages → Source: GitHub Actions, then run this workflow again."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
